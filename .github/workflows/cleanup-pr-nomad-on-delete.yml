# Cleanup leftover Nomad preview jobs when a PR head branch is deleted.
# Decap CMS closePR then deleteBranch; GitHub may skip the pull_request/closed
# run in pages-gh.yml if it cannot build a merge commit. delete events always
# use this workflow from the default branch, so they still run.
name: Cleanup Nomad preview on branch delete

on:
  delete:

jobs:
  cleanup-pr-nomad:
    if: github.event.ref_type == 'branch' && vars.ENABLE_NOMAD == 'true'
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: docker-image
    runs-on: ubuntu-latest
    env:
      NOMAD_VERSION: ${{ vars.NOMAD_VERSION || '1.11.1' }}
      SERVICE: "${{ vars.__SERVICE__ }}"
      NOMAD_NAMESPACE: "${{ vars.__NAMESPACE__ }}"
    steps:
      - name: Checkout default branch (required for local action)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Find closed PR for deleted branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DELETED_REF: ${{ github.event.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: bash "${GITHUB_WORKSPACE}/.github/actions/cleanup-pr-nomad-job/find-closed-pr.sh"

      - name: Cleanup Nomad jobs for deleted PR branch
        if: steps.pr.outputs.pr_number != ''
        uses: ./.github/actions/cleanup-pr-nomad-job
        with:
          job_name: ${{ env.SERVICE }}-pr-${{ steps.pr.outputs.pr_number }}-
          nomad_version: ${{ env.NOMAD_VERSION }}
          nomad_token: ${{ secrets.NOMAD_SERVER_TOKEN }}
          nomad_addr: ${{ secrets.NOMAD_SERVER_ADDRESS }}
          nomad_namespace: ${{ env.NOMAD_NAMESPACE }}
          allow_missing: 'true'
