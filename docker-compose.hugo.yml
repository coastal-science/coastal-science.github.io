services:
  hugo:
    # Upstream theme CI uses peaceiris/actions-hugo hugo-version: 'latest'.
    # As of 2026-11-14 that is v0.170.0 (single binary; -ext image still has Git + Dart Sass).
    image: floryn90/hugo:0.170.0-ext-alpine
    container_name: hugo-dev
    # Same names as CI: workflows set these from github.sha / github.actor.
    # Locally GITHUB_* is usually unset, so SHA falls back to HEAD.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - export HUGO_CI_SHORT_SHA="$${GITHUB_SHA:-$$(git rev-parse HEAD)}" && export HUGO_CI_AUTHOR="$${GITHUB_ACTOR:-}" && exec hugo server --bind 0.0.0.0 --buildDrafts --buildFuture
    volumes:
      - .:/src
    ports:
      - "1313:1313"
