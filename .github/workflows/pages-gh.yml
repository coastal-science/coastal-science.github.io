# Workflow for building and deploying Hugo site (Production + Preview)
name: Deploy Hugo site - Production and Preview
run-name: ${{ github.event_name == 'pull_request' && format('Preview [PR {0} - {1}] {2}  ', github.event.pull_request.number, github.head_ref, github.event.head_commit.message) || format('[{0}] {1}', github.ref_name, github.event.head_commit.message) }}

on:
  # Only push to default branch — avoids double trigger when pushing to a PR branch (push + pull_request synchronize)
  push:
    branches: [main]

  # Runs on pull requests for Deploy Preview Links (one run per commit on a PR)
  pull_request:
    types: [opened, synchronize, reopened, closed]

  # Allows you to run this workflow manually from the Actions tab (choice input with options)
  workflow_dispatch:
    inputs:
      nomad_job_template:
        required: false
        description: The Nomad job template to use for the deployment.
        type: choice
        options:
          - nomad/template.nomad
          - nomad/decap.template.nomad
        default: nomad/template.nomad
      use_decap:
        required: false
        description: Override Decap usage. Set to "true" or "false" to override branch-based determination; leave as "auto" for automatic.
        type: choice
        options:
          - auto
          - "true"
          - "false"
        default: auto

  workflow_call: # allows reusing the workflow (string input; choice not supported for workflow_call)
    inputs:
      enable_github_pages:
        description: Run Pages even when ENABLE_GITHUB_PAGES is unset. Default false.
        type: boolean
        required: false
        default: false
      enable_nomad:
        description: Run Nomad even when ENABLE_NOMAD is unset. Default false.
        type: boolean
        required: false
        default: false
      caller_event_name:
        description: Original event_name from the top-level caller (push, pull_request, workflow_dispatch). Nested jobs see workflow_call.
        type: string
        required: false
        default: ''
      caller_event_action:
        description: Original pull_request action from the top-level caller.
        type: string
        required: false
        default: ''
      pr_number:
        type: string
        required: false
        default: ''
      pr_head_sha:
        type: string
        required: false
        default: ''
      pr_merged:
        type: boolean
        required: false
        default: false
      head_ref:
        type: string
        required: false
        default: ''
      nomad_job_template:
        required: false
        description: The Nomad job template to use for the deployment (e.g. nomad/template.nomad or nomad/decap.template.nomad).
        type: string
        default: ''
      use_decap:
        required: false
        description: Override USE_DECAP ("true" or "false"); leave empty for branch-based determination.
        type: string
        default: ""
    # inputs:
    #   nomad_job_template:
    #     required: false
    #     description: The Nomad job template to use for the deployment (e.g. nomad/template.nomad or nomad/decap.template.nomad).
    #     type: string
    #     default: nomad/template.nomad
    #   use_decap:
    #     required: false
    #     description: Override USE_DECAP ("true" or "false"); leave empty for branch-based determination.
    #     type: string
    #     default: ""
    #   target:
    #     required: false
    #     type: string
    # secrets:
    #   token:
    #     required: false

# Allow one concurrent deployment
concurrency:
  group: ${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('branch-{0}', github.ref_name) }}
  cancel-in-progress: true

jobs:
  generate-timestamp:
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Set TIMESTAMP and get REPO_NAME
        id: date
        run: |
             export DATE=$(date +'%Y%m%d-%H%M%S')
             REPO_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}
             echo "TIMESTAMP=$DATE" >> $GITHUB_ENV
             echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
             echo "${{ github.event_name}} .. ${{ github.event.action }} .. ${{ github.event.pull_request.merged }}"
             
    outputs:
      TIMESTAMP: ${{ env.TIMESTAMP }}
      REPO_NAME: ${{ env.REPO_NAME }}

  github-pages:
    needs:
      - generate-timestamp
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-github-pages.yml
    secrets: inherit
    with:
      timestamp: ${{ needs.generate-timestamp.outputs.TIMESTAMP }}
      repo_name: ${{ needs.generate-timestamp.outputs.REPO_NAME }}
      event_name: ${{ inputs.caller_event_name || github.event_name }}
      event_action: ${{ inputs.caller_event_action || github.event.action }}
      enable_github_pages: ${{ github.event_name == 'workflow_call' && inputs.enable_github_pages || false }}

  nomad:
    needs:
      - generate-timestamp
    permissions:
      contents: write
      packages: write
      id-token: write
      statuses: write
    uses: ./.github/workflows/deploy-nomad.yml
    secrets: inherit
    with:
      timestamp: ${{ needs.generate-timestamp.outputs.TIMESTAMP }}
      repo_name: ${{ needs.generate-timestamp.outputs.REPO_NAME }}
      event_name: ${{ inputs.caller_event_name || github.event_name }}
      event_action: ${{ inputs.caller_event_action || github.event.action }}
      pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
      pr_head_sha: ${{ inputs.pr_head_sha || github.event.pull_request.head.sha }}
      pr_merged: ${{ github.event_name == 'workflow_call' && inputs.pr_merged || github.event.pull_request.merged == true }}
      head_ref: ${{ inputs.head_ref || github.head_ref }}
      nomad_job_template: ${{ inputs.nomad_job_template }}
      use_decap: ${{ inputs.use_decap || 'auto' }}
      enable_nomad: ${{ github.event_name == 'workflow_call' && inputs.enable_nomad || false }}
