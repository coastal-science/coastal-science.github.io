# Thin entrypoint: triggers live here; implementation is in VWJF/rcg-sites@refactor-from-cs.
# Switch the pin to a tag/SHA when rcg-sites publishes stable releases.
name: Deploy Hugo site - Production and Preview
run-name: ${{ github.event_name == 'pull_request' && format('Preview [PR {0} - {1}] {2}  ', github.event.pull_request.number, github.head_ref, github.event.head_commit.message) || format('[{0}] {1}', github.ref_name, github.event.head_commit.message) }}

on:
  push:
    branches: [main]

  pull_request:
    types: [opened, synchronize, reopened, closed]

  workflow_call:
    inputs:
      enable_github_pages:
        description: Force-on override for Pages when repo var ENABLE_GITHUB_PAGES is unset/false. Default false.
        type: boolean
        required: false
        default: false
      enable_nomad:
        description: Force-on override for Nomad when repo var ENABLE_NOMAD is unset/false. Default false.
        type: boolean
        required: false
        default: false
      caller_event_name:
        description: Original event_name from the top-level caller.
        type: string
        required: false
        default: ''
      caller_event_action:
        description: Original pull_request action from the top-level caller.
        type: string
        required: false
        default: ''
      pr_number:
        type: string
        required: false
        default: ''
      pr_head_sha:
        type: string
        required: false
        default: ''
      pr_merged:
        type: boolean
        required: false
        default: false
      head_ref:
        type: string
        required: false
        default: ''
      nomad_job_template:
        required: false
        description: Nomad job template path override.
        type: string
        default: ''
      use_decap:
        required: false
        description: Override USE_DECAP ("true" or "false"); leave empty for branch-based determination.
        type: string
        default: ""
      runs_on:
        description: Runner label or JSON array. Empty defaults to ubuntu-latest in rcg-sites.
        type: string
        required: false
        default: ''

# Allow one concurrent deployment per PR/branch. Group must differ from the reusable
# workflow concurrency group in VWJF/rcg-sites pages-gh.yml (same formula without this infix),
# or GitHub deadlocks: parent `deploy` vs nested `deploy / deploy`.
concurrency:
  group: ${{ github.repository }}-coastal-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('branch-{0}', github.ref_name) }}
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: write
      pages: write
      packages: write
      id-token: write
      statuses: write
    uses: VWJF/rcg-sites/.github/workflows/pages-gh.yml@refactor-from-cs
    secrets: inherit
    with:
      enable_github_pages: ${{ github.event_name == 'workflow_call' && inputs.enable_github_pages || false }}
      enable_nomad: ${{ github.event_name == 'workflow_call' && inputs.enable_nomad || false }}
      caller_event_name: ${{ inputs.caller_event_name || github.event_name }}
      caller_event_action: ${{ inputs.caller_event_action || github.event.action }}
      pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
      pr_head_sha: ${{ inputs.pr_head_sha || github.event.pull_request.head.sha }}
      pr_merged: ${{ github.event_name == 'workflow_call' && inputs.pr_merged || github.event.pull_request.merged == true }}
      head_ref: ${{ inputs.head_ref || github.head_ref }}
      nomad_job_template: ${{ inputs.nomad_job_template }}
      use_decap: ${{ inputs.use_decap }}
      runs_on: ${{ inputs.runs_on }}
