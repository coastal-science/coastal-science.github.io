# Thin entrypoint: triggers live here; implementation is in VWJF/rcg-sites@refactor-from-cs.
# Switch the pin to a tag/SHA when rcg-sites publishes stable releases.
#
# Decap CMS closePR then deleteBranch; GitHub may skip the pull_request/closed
# run in pages-gh.yml if it cannot build a merge commit. delete events always
# use this workflow from the default branch, so they still run.
name: Cleanup Nomad preview on branch delete

on:
  delete:

jobs:
  cleanup:
    if: github.event.ref_type == 'branch' && vars.ENABLE_NOMAD == 'true'
    permissions:
      pull-requests: read
    uses: VWJF/rcg-sites/.github/workflows/cleanup-pr-nomad-on-delete.yml@refactor-from-cs
    secrets: inherit
    with:
      deleted_ref: ${{ github.event.ref }}
      ref_type: ${{ github.event.ref_type }}
