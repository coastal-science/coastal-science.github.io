# Composite action: stop and purge Nomad jobs whose IDs start with job_name.
# job_name may be a full ID (SERVICE-pr-N-SHA) or a prefix (SERVICE-pr-N-).
# An exact ID is a prefix of itself, so existing single-job callers are unchanged.
name: Cleanup PR Nomad job
description: Stop and purge Nomad jobs matching a job ID or ID prefix.

inputs:
  job_name:
    description: Job ID or ID prefix to stop and purge (e.g. SERVICE-pr-NUMBER-SHA or SERVICE-pr-NUMBER-). All jobs in the namespace whose IDs start with this value are stopped.
    required: true
  nomad_version:
    description: Nomad CLI version to install.
    required: false
    default: '1.11.1'
  nomad_token:
    description: Nomad ACL token (pass from secrets; e.g. secrets.NOMAD_SERVER_TOKEN).
    required: true
  nomad_addr:
    description: Nomad server address (pass from secrets; e.g. secrets.NOMAD_SERVER_ADDRESS).
    required: true
  nomad_namespace:
    description: Nomad namespace the job was submitted to (pass from vars; e.g. vars.__NAMESPACE__). Required so stop/status look in the same namespace as deploy.
    required: true
  sleep_seconds:
    description: Seconds to wait after stop/purge before verifying job is gone.
    required: false
    default: '5'
  allow_missing:
    description: If true, no matching jobs is success (already gone). Default false. Use when a later trigger (branch delete) may run after close cleanup already succeeded.
    required: false
    default: 'false'

outputs:
  cleanup_success:
    description: "true if job was removed, false otherwise"
    value: ${{ steps.cleanup.outputs.cleanup_success }}
  job_name:
    description: Job ID or prefix that was cleaned up
    value: ${{ inputs.job_name }}

runs:
  using: composite
  steps:
    - name: Setup Nomad CLI
      uses: hashicorp/setup-nomad@main
      with:
        version: ${{ inputs.nomad_version }}

    - name: Stop and purge Nomad job
      id: cleanup
      env:
        NOMAD_TOKEN: ${{ inputs.nomad_token }}
        NOMAD_ADDR: ${{ inputs.nomad_addr }}
        NOMAD_NAMESPACE: ${{ inputs.nomad_namespace }}
        JOB_NAME: ${{ inputs.job_name }}
        SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
        ALLOW_MISSING: ${{ inputs.allow_missing }}
      shell: bash
      run: |
        stop_one() {
          local job="$1"
          echo "Stopping Nomad job: ${job} (namespace: ${NOMAD_NAMESPACE})"
          set +e
          STOP_OUTPUT=$(nomad job stop -purge -verbose "${job}" 2>&1)
          STOP_EXIT=$?
          set -e
          printf '%s\n' "${STOP_OUTPUT}"

          # "Job not found" is a failure. "Already gone" is success only after stop
          # succeeded in this namespace (the job existed and was purged).
          if [ "${STOP_EXIT}" -ne 0 ]; then
            if printf '%s\n' "${STOP_OUTPUT}" | grep -qiE 'No job\(s\) with prefix or ID'; then
              echo "::error::Nomad job ${job} was not found in namespace ${NOMAD_NAMESPACE}. Cleanup did not stop a running preview."
            else
              echo "::error::nomad job stop failed for ${job} in namespace ${NOMAD_NAMESPACE} (exit ${STOP_EXIT})."
            fi
            return 1
          fi

          sleep "${SLEEP_SECONDS}"
          if nomad job status "${job}" 2>/dev/null; then
            echo "::error::Job ${job} still exists in namespace ${NOMAD_NAMESPACE} after stop -purge."
            return 1
          fi
          echo "✓ Successfully cleaned up job: ${job}"
          return 0
        }

        echo "Looking for jobs with prefix: ${JOB_NAME} (namespace: ${NOMAD_NAMESPACE})"
        JOBS=$(nomad job status 2>/dev/null \
          | awk -v p="${JOB_NAME}" 'NR>1 && index($1, p) == 1 {print $1}' || true)

        TOTAL=$(printf '%s\n' "${JOBS}" | sed '/^$/d' | wc -l | tr -d ' ')
        echo "Found ${TOTAL} matching job(s):"
        echo "${JOBS}"

        if [ "${TOTAL}" -eq 0 ]; then
          if [ "${ALLOW_MISSING}" = "true" ]; then
            echo "cleanup_success=true" >> "$GITHUB_OUTPUT"
            echo "No Nomad jobs with prefix ${JOB_NAME} in namespace ${NOMAD_NAMESPACE} (already gone)."
            exit 0
          fi
          echo "cleanup_success=false" >> "$GITHUB_OUTPUT"
          echo "::error::No Nomad jobs with prefix ${JOB_NAME} in namespace ${NOMAD_NAMESPACE}."
          exit 1
        fi

        FAILED=0
        for job in ${JOBS}; do
          [ -z "${job}" ] && continue
          if ! stop_one "${job}"; then
            FAILED=$((FAILED + 1))
          fi
        done

        if [ "${FAILED}" -ne 0 ]; then
          echo "cleanup_success=false" >> "$GITHUB_OUTPUT"
          echo "::error::Failed to clean up ${FAILED} Nomad job(s) for prefix ${JOB_NAME}."
          exit 1
        fi
        echo "cleanup_success=true" >> "$GITHUB_OUTPUT"
        echo "Cleaned up ${TOTAL} Nomad job(s) with prefix ${JOB_NAME}."

    - name: Summary
      if: always()
      shell: bash
      run: |
        if [ "${{ steps.cleanup.outputs.cleanup_success }}" = "true" ]; then
          echo "✓ PR deployment cleanup completed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "Cleaned up Nomad job: ${{ inputs.job_name }}" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "✗ PR deployment cleanup failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Job: ${{ inputs.job_name }} (namespace: ${{ inputs.nomad_namespace }})" >> "$GITHUB_STEP_SUMMARY"
        fi
