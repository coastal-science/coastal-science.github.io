# Called by pages-gh.yml. Do not give this file its own push/pull_request triggers.
name: Deploy GitHub Pages

on:
  workflow_call:
    inputs:
      timestamp:
        description: Shared run timestamp (for logs).
        type: string
        required: false
        default: ''
      repo_name:
        description: Repository name without owner (safe.directory / workspace).
        type: string
        required: true
      event_name:
        description: Original caller event (push, pull_request, workflow_dispatch). Nested calls see workflow_call.
        type: string
        required: true
      event_action:
        description: Original pull_request action (opened, synchronize, closed, …).
        type: string
        required: false
        default: ''
      enable_github_pages:
        description: Run Pages even when ENABLE_GITHUB_PAGES is unset. Default false.
        type: boolean
        required: false
        default: false

jobs:
######################################################
## Build and publish a staging site to GitHub Pages ##
######################################################

  # Build job
  build-github-pages:
    # Skip Pages if PR is closed so a discarded draft is not published to github.io
    if: (vars.ENABLE_GITHUB_PAGES == 'true' || inputs.enable_github_pages) && (inputs.event_name != 'pull_request' || inputs.event_action != 'closed')
    
    runs-on: ubuntu-latest
    container:
      #  If Setup Pages ever fails for lack of Node, the fix is to drop the job-level container and keep only the Hugo action.
      image: peaceiris/hugo

    env:
      HUGO_VERSION: "${{ vars.HUGO_VERSION }}" # 0.147.8 # latest  #  0.126.1 
      HUGO_FORMS: ${{ vars.HUGO_FORMS }}
      HUGO_SERVICES_GOOGLEANALYTICS_ID: ${{ vars.HUGO_SERVICES_GOOGLEANALYTICS_ID }}
      REPO_NAME: ${{ inputs.repo_name }}

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: read
    
    steps:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ vars.HUGO_VERSION }}
          extended: true

      - name: Pre-Build ls
        run: |
          ls -lah
          echo "${{ inputs.timestamp }}" from env
          echo "${{ steps.pages.outputs.base_url }}/" from env

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive) # failing on ubuntu container
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
          # set-safe-directory: '/__w/coastal-science.github.io/coastal-science.github.io' # The process '/usr/bin/git' failed with exit code 128
          # set-safe-directory: '/__w/${{ env.REPO_NAME }}/${{ env.REPO_NAME }}' # The process '/usr/bin/git' failed with exit code 128, resorting to manual call
          
      - name: Set safe directory workaround
        run: |
          git config --global --add safe.directory /__w/${{ env.REPO_NAME }}/${{ env.REPO_NAME }}
          
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: staging
          HUGO_ENV: staging
        run: |
          hugo \
            --gc \
            --buildDrafts \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
            
      - name: Post-Build ls
        run: ls -lah public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # Deployment job
  deploy-github-pages:
    # Skip Pages if PR is closed so a discarded draft is not published to github.io
    if: (vars.ENABLE_GITHUB_PAGES == 'true' || inputs.enable_github_pages) && (inputs.event_name != 'pull_request' || inputs.event_action != 'closed')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: write
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    needs: build-github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
