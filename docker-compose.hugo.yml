services:
  hugo:
    # Upstream theme CI uses peaceiris/actions-hugo hugo-version: 'latest'.
    # As of 2026-11-14 that is v0.170.0 (single binary; -ext image still has Git + Dart Sass).
    image: floryn90/hugo:0.170.0-ext-alpine
    container_name: hugo-dev
    command: server --bind 0.0.0.0 --buildDrafts --buildFuture
    volumes:
      - .:/src
    ports:
      - "1313:1313"
